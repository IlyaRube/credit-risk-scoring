[project]
name = "credit-risk-scoring"
version = "0.1.0"
description = "Reproducible educational credit default risk scoring project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "ucimlrepo>=0.0.7,<1.0",
    "joblib>=1.4,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
    "jupyterlab>=4.2,<5.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
